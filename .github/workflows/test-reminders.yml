name: Scheduled Test Reminders (15-min)

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  trigger-test-reminders:
    name: Call /api/cron/test-reminders
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Test Reminders Endpoint
        run: |
          response=$(curl -s -w "\n%{http_code}" -X GET "https://bpsc.dpdns.org/api/cron/test-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Accept: application/json")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP Status Code: $http_code"
          echo "Response Body: $body"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Successfully executed test reminders cron."
          else
            echo "Error: Cron trigger failed with status $http_code"
            exit 1
          fi
