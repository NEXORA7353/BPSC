<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <style>
      .square-edge { fill: #f8fafc; stroke: #3b82f6; stroke-width: 3; rx: 8; }
      .circle-edge { fill: #eff6ff; stroke: #dc2626; stroke-width: 2.5; }
      .dim-line { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .dim-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #1e293b; }
      @media (prefers-color-scheme: dark) {
        .square-edge { fill: #0f172a; stroke: #60a5fa; }
        .circle-edge { fill: #1e293b; stroke: #f87171; }
        .dim-text { fill: #f8fafc; }
      }
    </style>
  </defs>

  <!-- Square 10cm x 10cm -->
  <rect x="50" y="50" width="200" height="200" class="square-edge" />

  <!-- Inscribed Circle d = 10cm, r = 5cm -->
  <circle cx="150" cy="150" r="100" class="circle-edge" />

  <!-- Diameter line -->
  <line x1="50" y1="150" x2="250" y2="150" class="dim-line" style="stroke: #ef4444;" />
  <circle cx="50" cy="150" r="3.5" fill="#ef4444" />
  <circle cx="250" cy="150" r="3.5" fill="#ef4444" />
  <circle cx="150" cy="150" r="3.5" fill="#ef4444" />

  <!-- Diameter label -->
  <text x="140" y="142" class="dim-text" style="fill: #dc2626;">d = 10 सेमी</text>
  <text x="140" y="170" class="dim-text" style="font-size: 11px; fill: #dc2626;">(त्रिज्या r = 5 सेमी)</text>

  <!-- Bottom Dimension: 10cm -->
  <line x1="50" y1="265" x2="250" y2="265" class="dim-line" />
  <line x1="50" y1="258" x2="50" y2="272" stroke="#64748b" stroke-width="1.5" />
  <line x1="250" y1="258" x2="250" y2="272" stroke="#64748b" stroke-width="1.5" />
  <text x="120" y="285" class="dim-text">भुजा = 10 सेमी</text>
</svg>
