  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BPSC Maths" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="BPSC TRE 4.0 Mathematics CBT Exam Portal | Authentic Mock Tests" />
    <meta property="og:description" content="BPSC TRE 4.0 Mathematics real mock test portal with 5 options, negative marking, per-question time analysis, and previous exam questions." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-blue-600 selection:text-white transition-colors duration-150">
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('bpsc_app_theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
      // Clear all old service worker caches to prevent 404s on rebuild
      if ('caches' in window) {
        caches.keys().then(function(names) {
          names.forEach(function(name) { caches.delete(name); });
        });
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(reg) {
            reg.update();
          });
        });
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.addEventListener('updatefound', function() {
              var newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'activated') {
                    window.location.reload();
                  }
                });
              }
            });
          }).catch(function(err) {
            console.log('SW registration failed:', err);
          });
        });
      }
    </script>
    <div id="root">
      <div style="min-height:100vh;background:#0A0F1D;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;">
        <div style="width:56px;height:56px;border-radius:16px;background:rgba(245,165,36,0.2);border:1px solid rgba(245,165,36,0.4);display:flex;align-items:center;justify-content:center;color:#F5A524;font-weight:900;font-size:14px;font-family:system-ui;">BPSC</div>
        <div style="width:32px;height:32px;border:3px solid #F5A524;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;"></div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
