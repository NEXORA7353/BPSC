<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="100%" className="max-w-md mx-auto">
  <defs>
    <style>
      .geom-line { stroke: #3b82f6; stroke-width: 2.5; stroke-linecap: round; }
      .geom-circle { fill: none; stroke: #1e293b; stroke-width: 2.5; }
      .geom-point { fill: #ef4444; }
      .geom-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .geom-dim { font-family: monospace; font-size: 12px; font-weight: 600; fill: #64748b; }
      @media (prefers-color-scheme: dark) {
        .geom-circle { stroke: #94a3b8; }
        .geom-text { fill: #f8fafc; }
        .geom-dim { fill: #94a3b8; }
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="420" height="220" rx="16" fill="#f8fafc" class="dark:fill-slate-900" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Circle -->
  <circle cx="150" cy="115" r="65" class="geom-circle" />

  <!-- Tangent Line PT -->
  <line x1="150" y1="50" x2="350" y2="125" class="geom-line" style="stroke: #10b981;" />

  <!-- Secant Line PBA -->
  <line x1="60" y1="125" x2="350" y2="125" class="geom-line" style="stroke: #3b82f6;" />

  <!-- Points -->
  <!-- T (Point of Tangency) -->
  <circle cx="150" cy="50" r="4.5" class="geom-point" style="fill: #10b981;" />
  <text x="145" y="38" class="geom-text">T</text>

  <!-- P (External Point) -->
  <circle cx="350" cy="125" r="5" class="geom-point" style="fill: #6366f1;" />
  <text x="360" y="130" class="geom-text">P</text>

  <!-- B (First intersection) -->
  <circle cx="215" cy="125" r="4.5" class="geom-point" />
  <text x="210" y="145" class="geom-text">B</text>

  <!-- A (Second intersection) -->
  <circle cx="85" cy="125" r="4.5" class="geom-point" />
  <text x="75" y="145" class="geom-text">A</text>

  <!-- Dimensions labels -->
  <!-- PT = 12 cm -->
  <text x="255" y="75" class="geom-dim" style="fill: #059669; font-weight: bold;">PT = 12 सेमी</text>

  <!-- PB = 8 cm -->
  <text x="260" y="145" class="geom-dim" style="fill: #2563eb; font-weight: bold;">PB = 8 सेमी</text>

  <!-- AB = ? -->
  <text x="130" y="145" class="geom-dim" style="fill: #dc2626; font-weight: bold;">AB = ?</text>
</svg>
