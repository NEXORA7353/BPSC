<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" width="100%" height="100%">
  <defs>
    <style>
      .box-front { fill: none; stroke: #3b82f6; stroke-width: 2.5; stroke-linecap: round; }
      .box-back { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .box-diag { stroke: #ef4444; stroke-width: 2.5; stroke-linecap: round; }
      .box-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .badge-bg { rx: 6; fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      @media (prefers-color-scheme: dark) {
        .box-front { stroke: #60a5fa; }
        .box-back { stroke: #64748b; }
        .box-text { fill: #f8fafc; }
        .badge-bg { fill: #0f172a; stroke: #334155; }
      }
    </style>
  </defs>

  <!-- Background card -->
  <rect width="340" height="280" fill="#f8fafc" class="dark:fill-slate-900" rx="16" />

  <!-- Front Face: (l=8, h=10) -->
  <polygon points="60,200 200,200 200,90 60,90" class="box-front" />

  <!-- Back Face -->
  <polygon points="120,150 260,150 260,40 120,40" class="box-back" />

  <!-- Connecting Edges -->
  <line x1="60" y1="90" x2="120" y2="40" class="box-front" />
  <line x1="200" y1="90" x2="260" y2="40" class="box-front" />
  <line x1="200" y1="200" x2="260" y2="150" class="box-front" />
  <line x1="60" y1="200" x2="120" y2="150" class="box-back" />

  <!-- Longest Diagonal (खंभा) from (60, 200) to (260, 40) -->
  <line x1="60" y1="200" x2="260" y2="40" class="box-diag" />
  <circle cx="60" cy="200" r="4.5" fill="#ef4444" />
  <circle cx="260" cy="40" r="4.5" fill="#ef4444" />

  <!-- Length l = 8 m badge -->
  <rect x="95" y="210" width="70" height="22" class="badge-bg" />
  <text x="130" y="226" class="box-text">l = 8 m</text>

  <!-- Breadth b = 6 m badge -->
  <rect x="210" y="175" width="70" height="22" class="badge-bg" />
  <text x="245" y="191" class="box-text">b = 6 m</text>

  <!-- Height h = 10 m badge -->
  <rect x="15" y="130" width="75" height="22" class="badge-bg" />
  <text x="52" y="146" class="box-text">h = 10 m</text>

  <!-- Diagonal label badge -->
  <rect x="95" y="95" width="150" height="26" rx="6" fill="#fee2e2" stroke="#fca5a5" />
  <text x="170" y="113" class="box-text" style="fill: #b91c1c; font-size: 13px;">विकर्ण = 10√2 m</text>
</svg>
